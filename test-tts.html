<!DOCTYPE html>
<html>
<head><title>TTS Test</title></head>
<body style="background:#1a1a2e;color:white;font-family:sans-serif;padding:40px">
<h2>Text-to-Speech Test</h2>
<p id="status">Checking...</p>
<p>Voices found: <span id="voice-count">0</span></p>
<div id="voice-list" style="font-size:12px;max-height:200px;overflow:auto"></div>
<br>
<button onclick="testSpeak('Hello world', 'en-US')" style="padding:10px 20px;font-size:16px">Test English</button>
<button onclick="testSpeak('こんにちは', 'ja-JP')" style="padding:10px 20px;font-size:16px">Test Japanese</button>
<button onclick="testSpeak('你好', 'zh-CN')" style="padding:10px 20px;font-size:16px">Test Chinese</button>
<button onclick="testSpeak('Bonjour', 'fr-FR')" style="padding:10px 20px;font-size:16px">Test French</button>
<br><br>
<div id="log" style="font-size:13px;color:#aaa"></div>

<script>
function log(msg) {
  document.getElementById('log').innerHTML += msg + '<br>';
  console.log(msg);
}

function updateVoices() {
  const voices = speechSynthesis.getVoices();
  document.getElementById('voice-count').textContent = voices.length;
  document.getElementById('voice-list').innerHTML = voices.map(v => 
    `${v.lang} - ${v.name} ${v.localService ? '(local)' : '(remote)'}`
  ).join('<br>');
  log('Voices loaded: ' + voices.length);
}

if ('speechSynthesis' in window) {
  document.getElementById('status').textContent = 'speechSynthesis supported ✓';
  updateVoices();
  speechSynthesis.onvoiceschanged = updateVoices;
  setTimeout(updateVoices, 500);
  setTimeout(updateVoices, 2000);
} else {
  document.getElementById('status').textContent = 'speechSynthesis NOT supported ✗';
  document.getElementById('status').style.color = 'red';
}

function testSpeak(text, lang) {
  log('--- Speaking: "' + text + '" lang=' + lang);
  speechSynthesis.cancel();
  
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.85;
  u.volume = 1;
  
  const voices = speechSynthesis.getVoices();
  log('Available voices: ' + voices.length);
  
  const langPrefix = lang.split('-')[0];
  const match = voices.find(v => v.lang === lang)
    || voices.find(v => v.lang.startsWith(langPrefix + '-'))
    || voices.find(v => v.lang.startsWith(langPrefix));
  
  if (match) {
    u.voice = match;
    log('Using voice: ' + match.name + ' (' + match.lang + ')');
  } else {
    log('No matching voice found, using default');
  }
  
  u.onstart = () => log('Speech started');
  u.onend = () => log('Speech ended');
  u.onerror = (e) => log('Speech ERROR: ' + e.error);
  
  speechSynthesis.speak(u);
  log('speak() called');
}
</script>
</body>
</html>
